name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.4"
        required: true
        default: "0.1.4"
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ("${{ github.ref_type }}" -eq "branch") {
            $version = "0.1.4"
          }
          "CODELOOM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore app
        run: dotnet restore codeloomapp/codeloomapp.csproj

      - name: Restore smoke tests
        run: dotnet restore codeloomapp.SmokeTests/codeloomapp.SmokeTests.csproj

      - name: Run Code Loom smoke tests
        run: dotnet run --project codeloomapp.SmokeTests/codeloomapp.SmokeTests.csproj -c Release --no-restore

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish codeloomapp/codeloomapp.csproj `
            -c Release `
            -p:PublishProfile=Windows-x64 `
            -p:Version=$env:CODELOOM_VERSION `
            -p:FileVersion="$env:CODELOOM_VERSION.0"

      - name: Bundle official GitHub CLI
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "Code-Loom-Release"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/cli/cli/releases/latest" `
            -Headers $headers

          $asset = $release.assets |
            Where-Object { $_.name -match '^gh_.+_windows_amd64\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the official Windows x64 GitHub CLI ZIP in the latest cli/cli release."
          }

          $publishDir = "codeloomapp/bin/Release/net10.0-windows/win-x64/publish"
          $destination = Join-Path $publishDir "tools/gh"
          $tempRoot = Join-Path $env:RUNNER_TEMP "codeloom-gh"
          $zipPath = Join-Path $env:RUNNER_TEMP $asset.name

          Remove-Item $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $tempRoot -Force

          $ghExe = Get-ChildItem $tempRoot -Filter "gh.exe" -File -Recurse | Select-Object -First 1
          if (-not $ghExe) {
            throw "The downloaded GitHub CLI archive did not contain gh.exe."
          }

          Copy-Item $ghExe.FullName (Join-Path $destination "gh.exe") -Force

          $license = Get-ChildItem $tempRoot -File -Recurse |
            Where-Object { $_.Name -match '^LICENSE(?:\.txt)?$' } |
            Select-Object -First 1
          if ($license) {
            Copy-Item $license.FullName (Join-Path $destination "LICENSE.txt") -Force
          }

          & (Join-Path $destination "gh.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled GitHub CLI could not start."
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $publishDir = "codeloomapp/bin/Release/net10.0-windows/win-x64/publish"
          $zipPath = "artifacts/CodeLoom-$env:CODELOOM_VERSION-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:CODELOOM_VERSION" "installer\CodeLoom.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CodeLoom-${{ env.CODELOOM_VERSION }}-windows
          path: |
            artifacts/CodeLoom-${{ env.CODELOOM_VERSION }}-win-x64.zip
            artifacts/installer/CodeLoom-Setup-${{ env.CODELOOM_VERSION }}-win-x64.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/CodeLoom-${{ env.CODELOOM_VERSION }}-win-x64.zip
            artifacts/installer/CodeLoom-Setup-${{ env.CODELOOM_VERSION }}-win-x64.exe
