name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "0.1.0"
          }
          "CODELOOM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore codeloomapp/codeloomapp.csproj

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish codeloomapp/codeloomapp.csproj `
            -c Release `
            -p:PublishProfile=Windows-x64 `
            -p:Version=$env:CODELOOM_VERSION `
            -p:FileVersion="$env:CODELOOM_VERSION.0"

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $publishDir = "codeloomapp/bin/Release/net10.0-windows/win-x64/publish"
          $zipPath = "artifacts/CodeLoom-$env:CODELOOM_VERSION-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:CODELOOM_VERSION" "installer\CodeLoom.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeLoom-${{ env.CODELOOM_VERSION }}-windows
          path: |
            artifacts/CodeLoom-${{ env.CODELOOM_VERSION }}-win-x64.zip
            artifacts/installer/CodeLoom-Setup-${{ env.CODELOOM_VERSION }}-win-x64.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/CodeLoom-${{ env.CODELOOM_VERSION }}-win-x64.zip
            artifacts/installer/CodeLoom-Setup-${{ env.CODELOOM_VERSION }}-win-x64.exe
