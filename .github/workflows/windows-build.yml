name: Windows Build

# Validate both compilation and the non-UI services that protect project data,
# assembly, imports, variables, and Unity exports before release packaging.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore app
        run: dotnet restore codeloomapp/codeloomapp.csproj

      - name: Restore smoke tests
        run: dotnet restore codeloomapp.SmokeTests/codeloomapp.SmokeTests.csproj

      - name: Build
        run: dotnet build codeloomapp/codeloomapp.csproj -c Release --no-restore

      - name: Run Code Loom smoke tests
        run: dotnet run --project codeloomapp.SmokeTests/codeloomapp.SmokeTests.csproj -c Release --no-restore
